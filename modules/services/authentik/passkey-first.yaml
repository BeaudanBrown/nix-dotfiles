version: 1
metadata:
  name: NAS - Passkey autofill at sign-in
entries:
  - id: first-factor
    model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      name: nas-passkey-first-factor
    attrs:
      device_classes: [webauthn]
      webauthn_user_verification: required
  # Supply the identification stage's optional conditional WebAuthn challenge.
  # Do not replace the password or MFA bindings used by the fallback path.
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      webauthn_stage: !KeyOf first-factor
