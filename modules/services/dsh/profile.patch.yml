# Deployment policy only. DSH owns the web profile, live reload and user settings.
- id: workspace-controller
  config:
    documentsDirectory: /etc/dsh-documents
- id: plugin-manager
  disabled: true
- id: ui-plugin-manager
  disabled: true
- id: tool-plugin-manager
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: /agent
- id: approval
  config:
    policy: never
- id: permission
  config:
    presets:
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
