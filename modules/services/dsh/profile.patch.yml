# Deployment policy only. DSH owns the web profile, live reload and user settings.
# rc.4's base already provides authorization; insert only the plugin row.
- insert:
    - id: dsh-native-codex-oauth
      name: dsh-native-codex-oauth
- id: workspace-controller
  config:
    documentsDirectory: /etc/dsh-documents
# Disable whole preset registrations rather than modifying their bundled tools.
- id: preset-standard
  disabled: true
- id: preset-cordis
  disabled: true
- id: agent-preset-registry
  config:
    default: ptc
- id: plugin-manager
  disabled: true
- id: ui-plugin-manager
  disabled: true
- id: tool-plugin-manager
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: /agent
- id: approval
  config:
    policy: never
- id: permission
  config:
    presets:
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
