version: 1
metadata:
  name: NAS - Forgejo OIDC
entries:
  # Resolve the public credentials when applying the blueprint. !Format
  # uses Python %-formatting; %r quotes each value as data, including comments.
  - id: forgejo-ssh-scope
    model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: NAS - Forgejo SSH public keys
    attrs:
      scope_name: forgejo_ssh_keys
      description: Import approved SSH public keys into Forgejo
      expression: !Format
        - |
          if request.user.username != "beau":
              return {}
          return {"forgejo_ssh_keys": [key.strip() for key in [%r, %r, %r, %r]]}
        - !File /run/credentials/authentik-worker.service/forgejo-ssh-grill
        - !File /run/credentials/authentik-worker.service/forgejo-ssh-t480
        - !File /run/credentials/authentik-worker.service/forgejo-ssh-nas
        - !File /run/credentials/authentik-worker.service/forgejo-ssh-dsh
  - id: forgejo-provider
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Forgejo
    attrs:
      client_id: nas-forgejo
      client_type: confidential
      client_secret: !File /run/credentials/authentik-worker.service/forgejo-secret
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://git.bepis.lol/user/oauth2/authentik/callback
      property_mappings:
        - !KeyOf forgejo-ssh-scope
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
  - id: forgejo-app
    model: authentik_core.application
    identifiers:
      slug: forgejo
    attrs:
      name: Forgejo
      provider: !KeyOf forgejo-provider
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf forgejo-app
      order: 0
    attrs:
      user: !Find [authentik_core.user, [username, !File /run/credentials/authentik-worker.service/forgejo-username]]
      failure_result: false
